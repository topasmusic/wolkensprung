plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def releaseArtifactBase = "${project.archives_base_name}-${project.version}-mc${project.minecraft_version}"

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "wolkensprung" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("pruneOldBuildLibs") {
    doLast {
        def libsDir = file("$buildDir/libs")
        if (!libsDir.exists()) {
            return
        }

        def currentPrefix = releaseArtifactBase
        fileTree(libsDir) {
            include "${project.archives_base_name}-*.jar"
        }.files.findAll { !it.name.startsWith(currentPrefix) }.each { file ->
            if (!file.delete()) {
                throw new GradleException("Could not delete old build artifact: ${file.name}")
            }
        }
    }
}

tasks.named("build").configure {
    finalizedBy(tasks.named("pruneOldBuildLibs"))
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") { rename { "${it}_${inputs.properties.archivesName}" } }
}

tasks.named("jar").configure {
    archiveFileName = "${releaseArtifactBase}.jar"
}

tasks.named("sourcesJar").configure {
    archiveFileName = "${releaseArtifactBase}-sources.jar"
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
